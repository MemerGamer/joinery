name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          version="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun test
      # Self-signed certificate: a stable signing identity lets macOS keep
      # folder permissions across updates. Imported by SHA-1 hash because the
      # certificate isn't trusted, so codesign can't look it up by name.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.JOINERY_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.JOINERY_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "JOINERY_SIGNING_P12 / JOINERY_SIGNING_P12_PASSWORD secrets are missing" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-certificate -c "Joinery Code Signing" -Z "$keychain" | awk '/SHA-1/ { print $NF }')"
          [ -n "$identity" ] || { echo "signing certificate not found after import" >&2; exit 1; }
          echo "JOINERY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "JOINERY_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: bun run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/release/*.tar.gz dist/release/*.sha256 --generate-notes
